mutation LoginUser($data: LoginUserInput!) {
    loginUser(data: $data) {
        user {
            ...User
        }
        accessToken
        refreshToken
    }
}
query FindMe {
    findMe {
        ...User
    }
}
query FindUsers($skip: Int, $take: Int) {
    findUsers(skip: $skip, take: $take) {
        users {
            ...User
        }
        usersCount
    }
}
mutation CreateUser($data: CreateUserInput!) {
    createUser(data: $data) {
        ...User
    }
}
