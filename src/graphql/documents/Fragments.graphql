fragment User on User {
    id
    createdAt
    updatedAt
    name
    email
}
fragment Product on Product {
    id
    createdAt
    updatedAt
    name
    characterstics
    minPrice
    maxPrice
    description
    available
    variants {
        ...Variant
    }
}
fragment Variant on Variant {
    id
    createdAt
    updatedAt
    characterstics
    price
    count
    currency
    images
}
