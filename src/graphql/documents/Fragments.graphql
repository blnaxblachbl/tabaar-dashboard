fragment User on User {
    id
    createdAt
    updatedAt
    name
    email
}
fragment Product on Product {
    id
    createdAt
    updatedAt
    name {
        ...LocaleContent
    }
    description {
        ...LocaleContent
    }
    characterstics
    minPrice
    maxPrice
    available
    variants {
        ...Variant
    }
}
fragment LocaleContent on LocaleContent {
    locale
    content
}
fragment Variant on Variant {
    id
    createdAt
    updatedAt
    characterstics
    price
    count
    currency
    images
}
fragment ApiKey on ApiKey {
    id
    createdAt
    updatedAt
    key
    name
    expiredAt
}
