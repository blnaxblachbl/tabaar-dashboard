query FindApiKeys($skip: Int, $take: Int) {
    findApiKeys(skip: $skip, take: $take) {
        apiKeys {
            ...ApiKey
        }
        apiKeysCount
    }
}
mutation DeleteApiKey($id: Int!) {
    deleteApiKey(id: $id) {
        ...ApiKey
    }
}
mutation UpdateApiKey($id: Int!, $data: UpdateApiKeyInput!) {
    updateApiKey(id: $id, data: $data) {
        ...ApiKey
    }
}
mutation CreateApiKey($data: CreateApiKeyInput!) {
    createApiKey(data: $data) {
        ...ApiKey
    }
}
query FindOneApiKey($id: Int!) {
    findOneApiKey(id: $id) {
        ...ApiKey
    }
}
